<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Medlemskap | Kjøp En Bowler</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .signup-wrap {
      max-width: 760px;
      margin: 16px auto 30px;
      padding: 18px;
      background: rgba(255, 250, 235, 0.85);
      border: 1px solid rgba(20, 20, 20, 0.3);
    }

    .signup-form {
      display: grid;
      gap: 12px;
    }

    .signup-form label {
      font-size: 17px;
      font-weight: 700;
      color: #1f1d1a;
    }

    .signup-form input,
    .signup-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #23201c;
      background: #fffdf8;
      color: #1f1d1a;
      font-size: 16px;
      font-family: inherit;
      box-sizing: border-box;
    }

    .signup-form input[type="file"] {
      padding: 8px 12px;
      cursor: pointer;
    }

    .form-section-title {
      font-size: 14px;
      font-weight: 700;
      color: #6d130f;
      margin-top: 16px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-section-title:first-of-type {
      margin-top: 0;
    }

    .signup-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .signup-actions button,
    .signup-actions a {
      display: inline-block;
      text-decoration: none;
      padding: 11px 16px;
      border: 2px solid #1b1a18;
      font-weight: 700;
      cursor: pointer;
      background: #f3e5bf;
      color: #121212;
    }

    .signup-actions .primary {
      background: #a82119;
      border-color: #6d130f;
      color: #fff3d9;
    }
  </style>
</head>
<body>
  <main class="poster">
    <nav class="site-nav">
      <a href="https://lilith959.github.io/kjop-en-bowler/index.html" class="logo-home"><img src="Img/Logo.png" alt="Kjøp En Bowler - Hjem"></a>
      <a href="https://lilith959.github.io/kjop-en-bowler/index.html">Historier</a>
      <a href="ads.html">Annonser</a>
      <a href="shop.html">Butikk</a>
      <a href="about.html">Om oss</a>
      <label class="dark-toggle" title="Nattmodus"><span class="dark-toggle-label">Nattmodus</span><span class="dark-toggle-switch"><input type="checkbox" id="darkToggle" /><span class="dark-toggle-track"></span></span></label>
    </nav>

    <h1 class="page-title">PREMIUM MEDLEMSKAP</h1>
    <p class="page-intro">Fyll inn informasjonen under for å fortsette premium-flyten.</p>

    <section class="signup-wrap">
      <form class="signup-form" action="#" method="post" enctype="multipart/form-data">
        <!-- Kontaktinformasjon -->
        <div class="form-section-title">Kontaktinformasjon</div>
        
        <label for="fullName">Fullt navn</label>
        <input id="fullName" name="fullName" type="text" placeholder="Fornavn Etternavn" required />

        <label for="address">Adresse</label>
        <input id="address" name="address" type="text" placeholder="Gatenavn og nummer, Postnummer By" required />

        <label for="phone">Telefonnummer</label>
        <input id="phone" name="phone" type="tel" placeholder="+47 000 00 000" required />

        <label for="email">E-post</label>
        <input id="email" name="email" type="email" placeholder="navn@epost.no" required />

        <!-- Bankinformasjon -->
        <div class="form-section-title">Bankinformasjon</div>
        
        <label for="cardLast4">De fire siste sifrene på bankkortet ditt</label>
        <input id="cardLast4" name="cardLast4" type="text" placeholder="f.eks. 1234" maxlength="4" required />

        <label for="personnummer">Personnummer</label>
        <input id="personnummer" name="personnummer" type="text" placeholder="f.eks. 01010190123" required />

        <!-- Verifisering -->
        <div class="form-section-title">Verifisering</div>
        
        <label for="cardPassImage">Bilde av bankkort og pass</label>
        <input id="cardPassImage" name="cardPassImage" type="file" accept="image/*" required />

        <!-- Identitetsverifisering -->
        <div class="form-section-title">Identitetsverifisering</div>
        
        <label for="motherMaidenName">Din mors pikenavn</label>
        <input id="motherMaidenName" name="motherMaidenName" type="text" placeholder="Mors pikenavn" required />

        <label for="firstTeacher">Navnet på din første lærer</label>
        <input id="firstTeacher" name="firstTeacher" type="text" placeholder="Første lærer" required />

        <label for="firstPet">Navnet på ditt første kjæledyr</label>
        <input id="firstPet" name="firstPet" type="text" placeholder="Første kjæledyr" required />

        <!-- Medlemskap -->
        <div class="form-section-title">Medlemskap</div>
        
        <label for="plan">Ønsket medlemskap</label>
        <select id="plan" name="plan" required>
          <option value="">Velg medlemskap</option>
          <option value="plus">Påskekrim Plus</option>
          <option value="premium">Påskepremium</option>
        </select>

        <label for="notes">Kommentar</label>
        <input id="notes" name="notes" type="text" placeholder="Valgfri info" />

        <div class="signup-actions">
          <button type="submit" class="primary">Send inn</button>
          <a href="story-2026.html">Tilbake til historien</a>
        </div>
      </form>
    </section>
  </main>
  <script>
    (function(){var t=document.getElementById('darkToggle');if(!t)return;if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark-mode');t.checked=true;}t.addEventListener('change',function(){document.body.classList.toggle('dark-mode',this.checked);localStorage.setItem('darkMode',String(this.checked));});}());
  </script>
</body>
</html>
